<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Hauptnavigation">
        <a href="{{ '/magazin/' | relative_url }}">Magazin</a>
        <a href="{{ '/news/' | relative_url }}">News</a>
        <a href="{{ '/themen/' | relative_url }}">Themen</a>
        <a href="{{ '/autoren/' | relative_url }}">Autoren</a>
        <a href="{{ '/partner/' | relative_url }}">Partner</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{{ content }}</main>
  <footer class="site-footer">
    <div class="wrap">
      <span>{{ site.title }}</span>
      <a href="{{ '/ki-transparenz/' | relative_url }}">Umgang mit KI</a>
      <a href="{{ '/impressum/' | relative_url }}">Impressum</a>
    </div>
  </footer>
</body>
</html>
