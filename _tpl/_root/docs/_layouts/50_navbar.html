---
layout: 20_body
---
{% if page.skip-navbar != true %}

<nte-navbar class="style-default fixed autoborder" scroll-threshold="500" style="--spacer-height: 104px">


    <nte-navbar-line class="style-default" style="--brand-height: 64px">
        <a slot="start" class="brand-logo" href="/" aria-label="{{ site.data.general.standorte.default.name | default: site.data.general.logoalt }}">
            <img
                src="/assets/logo64t.png"
                alt="{{ site.data.general.logoalt | default: site.data.general.standorte.default.name }}"
                class="loader-image"
                height="64"
            />
        </a>

        <nte-nav
            id="osman-main-navigation-horizontal"
            class="style-default nav-horizontal"
            slot="end"
            aria-label="Hauptnavigation"
            style="--nte-nav-flow: row; --nte-nav-align: stretch; width: auto"
        >
            {% include components/navigation/main.html tag="nav" root="" max_depth=2 %}
        </nte-nav>

        <nte-burger
            slot="end"
            aria-label="Navigation öffnen"
            aria-controls="navSidebar"
            static-state
            onclick="document.getElementById('navSidebar')?.toggle()"
            style="display: block"
            style-xl="display: none"
        ></nte-burger>
    </nte-navbar-line>
</nte-navbar>

<nte-offcanvas id="navSidebar" aria-label="Mobile Hauptnavigation">

    <nte-nav
        id="osman-main-navigation-vertical"
        class="style-default nav-vertical"
        aria-label="Mobile Hauptnavigation"
        style="--nte-nav-flow: column; --nte-nav-align: stretch"
    ></nte-nav>
    <tj-element-relocator
        source="#osman-main-navigation-horizontal"
        target="#osman-main-navigation-vertical"
        class="-xl:relocate"
    ></tj-element-relocator>
</nte-offcanvas>

{% endif %}

{{ content }}
