<style>

    tj-loader:not(.ready)  * {
        display: none !important; // Hide the loader by default
    }
    :where(#loader) {
        position: fixed;width: 100%;height: 100%;top: 0;left: 0;z-index: 9999;
        display: none;
    }

    body:has(tj-loader.visual) #loader{
        animation: loader-fade-out 0.2s ease forwards;

    }
    body:has(tj-loader.after-visual) #loader{
        display: none !important;
    }

    @keyframes loader-fade-in {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    @keyframes loader-fade-out {
        from {
            opacity: 1;
        }
        to {
            opacity: 0;
        }
    }

    #loader {
        --progress-color: var(--nt-primary, #55c900);
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background-color: rgba(0, 0, 0, 0.4);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        animation: loader-fade-in 0.8s ease 150ms forwards;
        & > div {
            max-width: 600px;
            aspect-ratio: 16 / 9;
            width: 90vw;
            min-width: 100px;

            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.9);

            padding: 10px;

            border-radius: 8px;
            display: flex;
            justify-content: space-evenly;

            #image {
                width: 80%;
                height: 50%;


                align-self: center;
                object-fit: contain;
                object-position: center center;

                img {
                    width: 100%;
                    height: 100%;
                    transition: opacity 0.1s linear;

                }
            }
            @keyframes loading {
                0% {
                    width: 0%;
                }
                1% {
                    width: 40%;
                }
                10% {
                    width: 60%;
                }
                30% {
                    width: 80%;
                }
                100% {
                    width: 100%;
                }
            }

            #loadbar {
                &::before {
                    display: block;
                    content: '';
                    width: 100%;
                    height: 100%;
                    background-color: var(--progress-color);
                    transition: background-color 0.3s ease;
                    animation: loading 10s ease;
                }
                box-shadow: 0 0 1px 1px lightgray;
                background-color: lightgray;
                position: relative;
                width: 100%;
                height: 8px;
                border: 1px solid black;

                border-radius: 4px;
            }
        }

    }
</style>
<div id="loader">
    <div>
        <div id="image">
            <img src="" loading="eager" fetchpriority="high">
        </div>
        <div id="loadbar"></div>
    </div>
</div>
