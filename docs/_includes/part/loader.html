<style>
    tj-loader:not(.ready) * {
        display: none !important; /* Hide the loader by default */
    }

    :where(#loader) {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 9999;
        display: none;
    }

    body:has(tj-loader.visual) #loader {
        animation: loader-fade-out 0.2s ease forwards;
    }

    body:has(tj-loader.after-visual) #loader {
        display: none !important;
    }

    @keyframes loader-fade-in {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    @keyframes loader-fade-out {
        from {
            opacity: 1;
        }
        to {
            opacity: 0;
        }
    }

    @keyframes loading {
        0% {
            width: 0%;
        }
        1% {
            width: 40%;
        }
        10% {
            width: 60%;
        }
        30% {
            width: 80%;
        }
        100% {
            width: 100%;
        }
    }

    #loader {
        --progress-color: var(--nt-primary, #55c900);
        --loader-overlay-bg: rgba(0, 0, 0, 0.4);
        --loader-panel-bg: rgba(255, 255, 255, 0.9);
        --loader-panel-border: rgba(0, 0, 0, 0.12);
        --loader-panel-shadow: rgba(0, 0, 0, 0.18);
        --loader-loadbar-bg: lightgray;
        --loader-loadbar-border: black;
        --loader-loadbar-shadow: lightgray;
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background-color: var(--loader-overlay-bg);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        animation: loader-fade-in 0.8s ease 150ms forwards;
    }

    @media (prefers-color-scheme: dark) {
        #loader {
            --loader-overlay-bg: rgba(0, 0, 0, 0.72);
            --loader-panel-bg: rgba(24, 24, 24, 0.98);
            --loader-panel-border: rgba(255, 255, 255, 0.18);
            --loader-panel-shadow: rgba(0, 0, 0, 0.55);
            --loader-loadbar-bg: #3b3b3b;
            --loader-loadbar-border: #d0d0d0;
            --loader-loadbar-shadow: rgba(255, 255, 255, 0.08);
        }
    }

    #loader > div {
        max-width: 600px;
        aspect-ratio: 16 / 9;
        width: 90vw;
        min-width: 100px;
        flex-direction: column;
        background-color: var(--loader-panel-bg);
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--loader-panel-border);
        box-shadow: 0 10px 30px var(--loader-panel-shadow);
        display: flex;
        justify-content: space-evenly;
    }

    #loader #image {
        width: 80%;
        height: 50%;
        align-self: center;
        object-fit: contain;
        object-position: center center;
    }

    #loader #image img {
        width: 100%;
        height: 100%;
        transition: opacity 0.1s linear;
    }

    #loader #loadbar {
        box-shadow: 0 0 1px 1px var(--loader-loadbar-shadow);
        background-color: var(--loader-loadbar-bg);
        position: relative;
        width: 100%;
        height: 8px;
        border: 1px solid var(--loader-loadbar-border);
        border-radius: 4px;
        overflow: hidden;
    }

    #loader #loadbar::before {
        display: block;
        content: '';
        width: 0%;
        height: 100%;
        background-color: var(--progress-color);
        transition: background-color 0.3s ease;
        animation: loading 10s ease forwards;
    }
</style>
<div id="loader">
    <div>
        <div id="image">
            <img src="" loading="eager" fetchpriority="high">
        </div>
        <div id="loadbar"></div>
    </div>
</div>
<script language="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var sourceImage = document.querySelector('img.loader-image');
        var loaderImage = document.querySelector('#loader img, #loder img');
        var loader = document.getElementById('loader') || document.getElementById('loder');

        if (!loaderImage || !loader) {
            return;
        }

        if (sourceImage && sourceImage.src) {
            loaderImage.src = sourceImage.src;
            return;
        }

        loaderImage.style.display = 'none';
    });
</script>
