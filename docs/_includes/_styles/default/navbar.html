<!-- Verwendet die neutrale Demo-Marke und dieselbe aktuelle Navigations-API wie das Nutzprojekt. -->
<nte-navbar class="style-default fixed autoborder autoshadow" scroll-threshold="500" style="--spacer-height: 64px">
    <nte-navbar-line class="style-default" style="--brand-height: 64px">
        <a slot="start" class="brand-logo" href="/" aria-label="{{ site.data.general.name | default: site.data.general.logoalt }}">
            <img
                src="/assets/leuffen-logo-big.svg"
                alt="{{ site.data.general.logoalt | default: site.data.general.name }}"
                class="loader-image"
                height="64"
            />
        </a>

        <nte-nav
            id="default-main-navigation-horizontal"
            class="style-default nav-horizontal"
            slot="end"
            aria-label="Hauptnavigation"
            style="--nte-nav-flow: row; --nte-nav-align: stretch; width: auto"
        >
            {% include el/nav2.html ptag="nav" %}
        </nte-nav>

        <nte-burger
            slot="end"
            aria-label="Navigation öffnen"
            aria-controls="navSidebar"
            static-state
            onclick="document.getElementById('navSidebar')?.toggle()"
            style="display: block"
            style-xl="display: none"
        ></nte-burger>
    </nte-navbar-line>
</nte-navbar>

<nte-offcanvas id="navSidebar" aria-label="Mobile Hauptnavigation">
    <div slot="header"><strong>Navigation</strong></div>
    <nte-nav
        id="default-main-navigation-vertical"
        class="style-default nav-vertical"
        aria-label="Mobile Hauptnavigation"
        style="--nte-nav-flow: column; --nte-nav-align: stretch"
    ></nte-nav>
    <tj-element-relocator
        source="#default-main-navigation-horizontal"
        target="#default-main-navigation-vertical"
        class="-xl:relocate"
    ></tj-element-relocator>
</nte-offcanvas>
