# Changes to this file will NOT be reloaded in jekyll --watch mode! Restart
# jekyll after updating this file!

lang: de-DE
timezone: Europe/Berlin
markdown: kramdown

google_analytics:
show_downloads: true

sass:
  sass_dir: _sass_disabled

livereload: false
exclude:
  - "*.bak"
  - "_src/*"
  - ".*"
  - "*~"
  - "~*"
  - "stats.html"
  # Lokale Auftragsnotizen und Provider-Cursor gehören nicht in den statischen Output.
  - "dev.findings.md"
  - "dev.state.yml"
  - "**/dev.findings.md"
  - "**/dev.state.yml"

collections:
  wissen:
    output: true
    permalink: /magazin/:path/
  autoren:
    output: true
    permalink: /autoren/:path/
  themen:
    output: true
    permalink: /themen/:path/
  partner:
    output: true
    permalink: /partner/:path/
  landing_pages:
    output: true
    permalink: /landingpages/:path/

# Frontmatter contracts for the ePraxis demo and collection pages.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      show_navbar: true
      show_title: true
      show_footer: true
  - scope:
      path: themes/dommer
    values:
      navigation_root: themes/dommer
      brand_url: /themes/dommer/dommer-start.html
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      content_type: news
      permalink: /news/:year/:month/:day/:title/
  - scope:
      path: ""
      type: wissen
    values:
      layout: article
      content_type: wissen
  - scope:
      path: ""
      type: autoren
    values:
      layout: author
  - scope:
      path: ""
      type: themen
    values:
      layout: topic
  - scope:
      path: ""
      type: partner
    values:
      layout: partner
  - scope:
      path: ""
      type: landing_pages
    values:
      layout: landing-page

plugins:
  - jekyll-optional-front-matter
  - jekyll-sitemap

# Die Demo-Kategorien liegen unter pages; Nutzprojekte beginnen direkt in docs.
navigation_root: pages
