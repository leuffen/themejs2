# Changes to this file will NOT be reloaded in jekyll --watch mode! Restart
# jekyll after updating this file!

lang: de-DE
timezone: Europe/Berlin
markdown: kramdown

google_analytics:
show_downloads: true

sass:
  sass_dir: _sass_disabled

livereload: false
exclude:
  - "*.bak"
  - "_src/*"
  - ".*"
  - "*~"
  - "~*"
  - "stats.html"
  # Lokale Auftragsnotizen und Provider-Cursor gehören nicht in den statischen Output.
  - "_dev.findings.md"
  - "dev.state.yml"
  - "**/_dev.findings.md"
  - "**/dev.state.yml"

collections:
  wissen:
    output: true
    permalink: /magazin/:path/
  autoren:
    output: true
    permalink: /autoren/:path/
  themen:
    output: true
    permalink: /themen/:path/
  partner:
    output: true
    permalink: /partner/:path/
  landing_pages:
    output: true
    permalink: /landingpages/:path/

# Gemeinsame Frame-Schalter und getrennte Defaults für jede Demo-Website.
defaults:
  - scope:
      path: ""
    values:
      layout: website-default
      show_navbar: true
      show_title: true
      show_footer: true
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      show_title: false
      content_type: news
      permalink: /news/:year/:month/:day/:title/
  - scope:
      path: ""
      type: wissen
    values:
      layout: article
      show_title: false
      content_type: wissen
  - scope:
      path: ""
      type: autoren
    values:
      layout: author
      show_title: false
  - scope:
      path: ""
      type: themen
    values:
      layout: topic
      show_title: false
  - scope:
      path: ""
      type: partner
    values:
      layout: partner
      show_title: false
  - scope:
      path: ""
      type: landing_pages
    values:
      layout: landing-page
      show_title: false

  # Die Body-Variant setzt nur visuelle Tokens; der Frame und seine Modifier bleiben unabhängig.
  - scope:
      path: "themes/dommer"
    values:
      # Aktiviert den eigenen Frame und einen ausdrücklich fiktiven Hinweis nur für diese Demo.
      layout: website-dommer
      demo_announcement: "Demo-Meldung: Bitte vereinbaren Sie Ihren Termin vorab."
      theme_profile: dommer
      navbar_classes: default-dark default-overlay
      nav_classes: default-dark
      location_id: dommer
      brand_url: /themes/dommer/dommer-start.html
  - scope:
      path: "themes/osman"
    values:
      layout: website-osman
      theme_profile: osman
      brand_url: /themes/osman/osman-start.html
      contact_url: /themes/osman/osman-start.html#osman-start-kontakt
  - scope:
      path: "themes/mueller"
    values:
      layout: website-mueller
      theme_profile: mueller
      brand_url: /themes/mueller/mueller-start.html
      contact_url: /themes/mueller/mueller-kontakt.html
  - scope:
      path: "themes/raven"
    values:
      layout: website-raven
      theme_profile: raven
      brand_url: /themes/raven/raven-start.html
      contact_url: /themes/raven/raven-kontakt.html
  - scope:
      path: "themes/unify"
    values:
      layout: website-unify
      theme_profile: unify
      brand_url: /themes/unify/unify-start.html
      contact_url: /themes/unify/unify-start.html#kontakt
      about_url: /themes/unify/unify-start.html#geschichte
      products_url: /themes/unify/unify-start.html#produkte
      faq_url: /themes/unify/unify-start.html#fragen
      resources_url: /themes/unify/unify-saas.html#leitfaden
      services_url: /themes/unify/unify-services.html#leistungen
      references_url: /themes/unify/unify-services.html#referenzen
  - scope:
      path: "themes/epraxis"
    values:
      layout: website-default
      theme_profile: epraxis
      brand_url: /themes/epraxis/epraxis-start.html

plugins:
  - jekyll-optional-front-matter
  - jekyll-sitemap

