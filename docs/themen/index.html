<div class="container"><tj-content-pane class="prose prose-xl"><h1>Themen</h1><p>News und Magazinbeiträge gemeinsam nach Themen erschlossen.</p><div class="d-flex flex-column g-2">{% assign topics = site.themen | sort: "title" %}{% for topic in topics %}<div class="p-3 border rounded"><a class="fw-600" href="{{ topic.url | relative_url }}">{{ topic.title }}</a>{% if topic.description %}<div class="fs-6">{{ topic.description }}</div>{% endif %}</div>{% endfor %}</div></tj-content-pane></div>
