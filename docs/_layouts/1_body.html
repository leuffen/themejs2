---
layout: 0_blanc
---
<style>
    tj-loader:not(.ready)  * {
        display: none !important; // Hide the loader by default
    }
    :where(#loader) {
        position: fixed;width: 100%;height: 100%;top: 0;left: 0;z-index: 9999;
        display: none;
    }
</style>
<body class="{{ page.body_class }}">
<div id="loader">
    <div>
        <div id="image">
            <img src="/assets/osman-logo.svg" loading="eager" fetchpriority="high">
        </div>
        <div id="loadbar"></div>
    </div>
</div>
<tj-loader class="stay-open--">
<micx-cdn-image-loader default-size-adjust=":1;1200:1">
<tj-responsive>
{{ content }}
</tj-responsive>
</micx-cdn-image-loader>
</tj-loader>
<nte-theme-switcher themes="{{ page.theme_classes}}"></nte-theme-switcher>

</body>
