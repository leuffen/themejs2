<!-- Die Variant lebt am Body, damit Token-Ableitungen und Grundtypografie am selben Element wirken. -->
<body class="{{ page.body_class | escape }}{% if page.theme_profile %} variant-{{ page.theme_profile | escape }}{% endif %}">
{% include fragments/loader.html %}
<tj-loader>
<micx-cdn-image-loader default-size-adjust=":1;1200:1">
<tj-responsive>
{{ content }}
</tj-responsive>
</micx-cdn-image-loader>
</tj-loader>
<tj-loader-scroll-restore></tj-loader-scroll-restore>

<nte-theme-switcher themes="{{ page.theme_classes}}"></nte-theme-switcher>

<!-- Stellt die bisherigen seitenweiten Meldungen nach dem Inhalt bereit. -->
<leuffen-vacation-modal></leuffen-vacation-modal>
</body>
