<div class="container"><tj-content-pane class="prose prose-xl"><h1>Autoren</h1><p>Alle Autorinnen, Autoren und Redaktionsprofile der ePraxis-Demo.</p><div class="d-flex flex-column g-2">{% assign authors = site.autoren | sort: "title" %}{% for author in authors %}<div class="p-3 border rounded"><a class="fw-600" href="{{ author.url | relative_url }}">{{ author.title }}</a>{% if author.description %}<div class="fs-6">{{ author.description }}</div>{% endif %}</div>{% endfor %}</div></tj-content-pane></div>
