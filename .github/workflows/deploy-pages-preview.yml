name: Deploy pull request Pages preview

# Veröffentlicht ein erfolgreich gebautes PR-Artifact aus dem vertrauenswürdigen Main-Kontext.
on:
  workflow_run:
    workflows:
      - Build pull request Pages preview
    types:
      - completed

# Die feste Pages-URL zeigt immer den zuletzt erfolgreich bereitgestellten Pull-Request-Stand.
concurrency:
  group: themejs2-pages-preview
  cancel-in-progress: true

# Der Main-Workflow darf das Quell-Artifact lesen und ausschließlich nach GitHub Pages deployen.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write


jobs:
  deploy:
    name: Deploy pull request site
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Lädt den statischen Output des exakt zugehörigen Pull-Request-Workflow-Laufs.
      - name: Download pull request site
        uses: actions/download-artifact@v8
        with:
          name: pull-request-pages-site
          path: ./_site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      # Verpackt den unveränderten statischen Output als GitHub-Pages-Artifact dieses Main-Laufs.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      # Veröffentlicht die zuletzt erfolgreich gebaute Pull-Request-Version.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

