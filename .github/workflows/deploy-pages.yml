name: Build pull request Pages preview

# Baut jeden neuen oder aktualisierten Pull Request als vollständig statische Theme-Vorschau.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Pro Pull Request zählt nur der zuletzt gepushte Stand.
concurrency:
  group: themejs2-pages-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Der Pull-Request-Build liest nur Repository-Inhalte und erhält keine Deploy-Berechtigung.
permissions:
  contents: read

jobs:
  build:
    name: Build pull request site
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      # Checkt exakt den aktuellen Head-Commit des Pull Requests ohne lokale Submodule aus.
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Richtet die unterstützte Node-Version ohne Abhängigkeit von einem vorhandenen Lockfile ein.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installiert die Abhängigkeiten und erzeugt oder aktualisiert dabei bei Bedarf das Lockfile.
      - name: Install dependencies
        run: npm install

      # Erzeugt die aktuellen JavaScript- und CSS-Assets für die Präsentationsseite.
      - name: Build frontend assets
        run: npm run build:site

      # Liest Domain und Basispfad aus der bestehenden GitHub-Pages-Konfiguration.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Rendert die Jekyll-Präsentation als vollständig statische Website.
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # Übergibt den statischen Stand ohne Deploy-Rechte an den nachgelagerten Main-Workflow.
      - name: Upload pull request site
        uses: actions/upload-artifact@v7
        with:
          name: pull-request-pages-site
          path: ./_site
          if-no-files-found: error
          retention-days: 1
