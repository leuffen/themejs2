name: Deploy Pages on pull request

# Baut interne Pull Requests vollständig und veröffentlicht den aktuellen Stand als Pages-Vorschau.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Für einen Pull Request wird nur der zuletzt gestartete Vorschau-Stand veröffentlicht.
concurrency:
  group: themejs2-pages-deploy
  cancel-in-progress: true

# Der interne PR-Workflow darf das fertige Artifact ausschließlich nach GitHub Pages deployen.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy pull request site
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkt exakt den aktuellen Head-Commit des internen Pull Requests aus.
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Richtet die für Installation und Vite-Build unterstützte Node-Version ein.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installiert die veröffentlichten Projektabhängigkeiten ohne lokale Workspace-Verknüpfungen.
      - name: Install dependencies
        run: npm update

      # Erzeugt die aktuellen JavaScript- und CSS-Assets vor dem statischen Jekyll-Build.
      - name: Build frontend assets
        run: npm run build:site

      # Liest Domain und Basispfad aus der bestehenden GitHub-Pages-Konfiguration.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Rendert die Präsentation einschließlich der frisch erzeugten Assets als statische Website.
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # Verpackt den vollständigen statischen Stand für das nachfolgende Pages-Deployment.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      # Veröffentlicht den aktuellen Pull-Request-Stand auf der konfigurierten Pages-URL.
      - name: Deploy pull request site
        id: deployment
        uses: actions/deploy-pages@v5
