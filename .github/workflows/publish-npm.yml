name: Publish package to npm

# Baut und veröffentlicht nach jedem Push auf den Hauptbranch eine neue Patch-Version.
on:
  push:
    branches:
      - main

# Serialisiert Veröffentlichungen, damit parallele Pushes nicht dieselbe Patch-Version verwenden.
concurrency:
  group: npm-publish-main
  cancel-in-progress: false

# Erteilt nur die für Checkout und npm-Provenance erforderlichen Berechtigungen.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      # Checkt den gepushten Stand einschließlich der als Workspaces verwendeten Submodule aus.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Richtet die unterstützte Node-Version und das öffentliche npm-Registry ein.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Installiert reproduzierbar die im Lockfile festgelegten Abhängigkeiten.
      - name: Install dependencies
        run: npm ci

      # Ermittelt die Registry-Version und setzt lokal die unmittelbar folgende Patch-Version.
      - name: Set next patch version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT_VERSION="$(npm view "$PACKAGE_NAME" version)"
          NEXT_VERSION="$(node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (![major, minor, patch].every(Number.isInteger)) process.exit(1); process.stdout.write(`${major}.${minor}.${patch + 1}`)' "$CURRENT_VERSION")"
          npm version "$NEXT_VERSION" --no-git-tag-version

      # Erzeugt vor der Veröffentlichung den aktuellen auslieferbaren Build.
      - name: Build package
        run: npm run build

      # Veröffentlicht das Scoped Package per Trusted Publishing und hinterlegt die npm-Provenance.
      - name: Publish package
        run: npm publish --access public --provenance
