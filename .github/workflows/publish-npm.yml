name: Publish package to npm

# Baut und veröffentlicht nach jedem Push auf den Hauptbranch die in package.json festgelegte Version.
on:
  push:
    branches:
      - main

# Serialisiert Veröffentlichungen, damit parallele Pushes nicht dieselbe Patch-Version verwenden.
concurrency:
  group: npm-publish-main
  cancel-in-progress: false

# Erteilt nur die für Checkout und npm-Provenance erforderlichen Berechtigungen.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      # Checkt den gepushten Stand einschließlich der als Workspaces verwendeten Submodule aus.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Richtet die unterstützte Node-Version und das öffentliche npm-Registry ein.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Installiert eine npm-Version, die GitHub OIDC Trusted Publishing unterstützt.
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      # Dokumentiert die tatsächlich für Build und Veröffentlichung eingesetzten Laufzeitversionen.
      - name: Show runtime versions
        run: |
          node --version
          npm --version

      # Installiert reproduzierbar die im Lockfile festgelegten Abhängigkeiten.
      - name: Install dependencies
        run: npm ci

      # Erzeugt vor der Veröffentlichung den aktuellen auslieferbaren Build.
      - name: Build package
        run: npm run build

      # Veröffentlicht das Scoped Package per Trusted Publishing und hinterlegt die npm-Provenance.
      - name: Publish package
        run: npm publish --access public --provenance
