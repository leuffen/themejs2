# Editable Front Matter fields for the bundled demo site.
fields:
  - name: title
    type: string
    label: Seitentitel
    description: Titel der Seite, der je nach Layout auch im Browser-Tab und in Suchergebnissen erscheint.
    allowNull: false
    allowEmpty: false
    order: 1
  - name: description
    type: string
    label: Meta Beschreibung
    description: Kurze Zusammenfassung des Seiteninhalts, die Suchmaschinen als Vorschautext verwenden können.
    allowNull: true
    allowEmpty: true
    order: 2
  - name: published
    type: switch
    label: Veröffentlicht
    default: false
    order: 10

  # Navigationseinträge können unabhängig voneinander aktiviert werden.
  - name: ptags
    type: multiselect
    label: Tags
    options:
      - value: nav
        label: In Hauptnavigation anzeigen
      - value: footernav
        label: In Footernavigation anzeigen
    default: []
    allowEmpty: true
    order: 50
  # Die numerische Reihenfolge steuert die Position in den Navigationsleisten.
  - name: order
    type: integer
    label: Sortierreihenfolge in den Navigationsleisten
    default: 50
    order: 60
  # Ohne expliziten Permalink bleibt der Wert null.
  - name: permalink
    type: string
    label: Permalink
    description: Legt eine eigene URL für die Seite fest. Standardmäßig leer lassen, damit die automatisch ermittelte Seiten-URL verwendet wird.
    default: null
    allowNull: true
    order: 20
